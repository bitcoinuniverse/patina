name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Specification byte contract
        run: npm run spec:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify vectors
        run: node cli.mjs vectors verify

      - name: Vectors are reproducible
        run: |
          npm run vectors:generate
          git diff --exit-code -- vectors examples

      - name: Check the public site
        run: node site/tools/verify.mjs

      - name: Check the documentation
        run: node docs/tools/verify.mjs

      # The cards, the sharing metadata and the search index are generated from
      # files in this repository. If regenerating them changes anything, someone
      # edited the output instead of the input.
      - name: The generated pages are reproducible
        run: |
          node site/tools/build-cards.mjs
          node docs/tools/stamp-meta.mjs
          node docs/tools/build-search-index.mjs
          git diff --exit-code -- site docs

      - name: Package contents
        run: npm pack --dry-run
