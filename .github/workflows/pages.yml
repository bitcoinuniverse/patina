name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit, tag, or branch to redeploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check the site
        run: node site/tools/verify.mjs

      - name: Check the documentation
        run: node docs/tools/verify.mjs

      # The cards, the sharing metadata and the search index are all generated
      # from files in this repository. If regenerating them changes anything,
      # somebody edited the output instead of the input.
      - name: The generated files are reproducible
        run: |
          node site/tools/build-cards.mjs
          node docs/tools/stamp-meta.mjs
          node docs/tools/build-search-index.mjs
          git diff --exit-code -- site docs

      - name: Assemble the published tree
        run: |
          mkdir -p public
          cp -r site/. public/
          mkdir -p public/docs
          cp -r docs/. public/docs/
          cp patina-protocol.md public/patina-protocol.md
          mkdir -p public/vectors
          cp vectors/golden.json vectors/manifest.json public/vectors/
          touch public/.nojekyll

      - name: Record the immutable deployment revision
        run: git rev-parse HEAD

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
