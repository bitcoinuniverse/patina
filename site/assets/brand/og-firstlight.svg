  </g>
  <circle cx="940" cy="300" r="186" fill="none" stroke="#e0a463" stroke-width="2.4"/>
  <circle cx="940" cy="300" r="175" fill="none" stroke="#b97a3c" stroke-width="1.4"/>
  <text x="940" y="530" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="17" letter-spacing="9" text-anchor="middle">FIRSTLIGHT</text>

  <g transform="translate(80,150) scale(1.28)" fill="none" stroke="#f0e8dc" stroke-width="9" stroke-linecap="butt">
    <g transform="translate(10,0)">
      <path d="M0 80 L0 16 L22 16 A16 16 0 0 1 22 48 L0 48"/>
      <g transform="translate(58,0)">
