  <text x="80" y="120" fill="#6cc7ab" font-family="ui-monospace, Consolas, monospace" font-size="20" letter-spacing="6">THE GENESIS ASSET</text>

  <text x="80" y="350" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="44">Firstlight Seals open once</text>
  <text x="80" y="404" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="44">and never again.</text>
  <text x="80" y="472" fill="#a4977f" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">One commit window of 4032 blocks. No allocation, no reserve, no price to anyone.</text>

  <path d="M80 520 L520 520" stroke="#52463a" stroke-width="1"/>
  <text x="80" y="558" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="2">You provide the endowment. It stays yours.</text>
