<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="card-title">
  <title id="card-title">The PATINA claim: commit, wait at least 144 blocks, then reveal.</title>
  <defs>
    <pattern id="strata" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#f0e8dc" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#14110d"/>
  <rect width="1200" height="630" fill="url(#strata)"/>
  <path d="M600 0 L600 630" stroke="#52463a" stroke-width="1" stroke-opacity="0.5"/>

  <g>
    <rect x="636" y="196" width="212" height="118" rx="4" fill="#1b1712" stroke="#52463a" stroke-width="1.4"/>
    <text x="660" y="230" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="3">STEP ONE</text>
    <text x="660" y="266" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="27">Commit</text>
    <text x="660" y="296" fill="#a4977f" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">reveals nothing</text>

    <path d="M848 255 L940 255" stroke="#52463a" stroke-width="1.4"/>
    <path d="M932 249 L942 255 L932 261" stroke="#6cc7ab" stroke-width="2.4" fill="none"/>
    <text x="856" y="240" fill="#6cc7ab" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="2">144 BLOCKS</text>

    <rect x="940" y="196" width="212" height="118" rx="4" fill="#1b1712" stroke="#52463a" stroke-width="1.4"/>
    <text x="964" y="230" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="3">STEP TWO</text>
    <text x="964" y="266" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="27">Reveal</text>
    <text x="964" y="296" fill="#a4977f" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">carrier is named</text>

    <path d="M636 396 L1152 396" stroke="#52463a" stroke-width="1"/>
    <path d="M700 314 L700 396" stroke="#52463a" stroke-width="1"/>
    <path d="M1046 314 L1046 396" stroke="#e0a463" stroke-width="2"/>
    <circle cx="700" cy="396" r="6" fill="#52463a"/>
    <circle cx="1046" cy="396" r="7" fill="#e0a463"/>
    <text x="636" y="432" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2">BLOCK HEIGHT</text>
    <text x="924" y="460" fill="#e0a463" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="2">DEPTH STARTS AT ZERO</text>
  </g>

  <g transform="translate(80,150) scale(1.28)" fill="none" stroke="#f0e8dc" stroke-width="9" stroke-linecap="butt">
    <g transform="translate(10,0)">
      <path d="M0 80 L0 16 L22 16 A16 16 0 0 1 22 48 L0 48"/>
      <g transform="translate(58,0)">
        <path d="M0 80 L22 16 L44 80"/>
        <path d="M6.9 60 L37.1 60"/>
      </g>
      <g transform="translate(122,0)">
        <path d="M0 16 L44 16"/>
        <path d="M22 16 L22 80"/>
      </g>
      <path d="M192 16 L192 80"/>
      <path d="M218 80 L218 16 L258 80 L258 16"/>
      <g transform="translate(278,0)">
        <path d="M0 80 L22 16 L44 80"/>
        <path d="M6.9 60 L37.1 60"/>
      </g>
    </g>
  </g>

  <text x="80" y="120" fill="#6cc7ab" font-family="ui-monospace, Consolas, monospace" font-size="20" letter-spacing="6">COMMIT, WAIT, REVEAL</text>

  <text x="80" y="350" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="44">Two transactions, and a day</text>
  <text x="80" y="404" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="44">of doing nothing between.</text>
  <text x="80" y="472" fill="#a4977f" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">The gap is what makes a claim impossible to snipe. No price, network fees only.</text>

  <path d="M80 520 L520 520" stroke="#52463a" stroke-width="1"/>
  <text x="80" y="558" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="2">The endowment stays yours and stays spendable</text>
</svg>
