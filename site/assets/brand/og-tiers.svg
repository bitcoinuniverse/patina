<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="card-title">
  <title id="card-title">The PATINA tier journey, from Raw at zero blocks to Elder at 210000 blocks.</title>
  <defs>
