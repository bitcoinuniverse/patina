      <circle cx="858" cy="315" r="26.8" fill="#b6a05a" fill-opacity="0.42" stroke="#b6a05a" stroke-width="2.4"/>
      <circle cx="858" cy="315" r="2.6" fill="#e0a463"/>
    </g>
    <g>
      <circle cx="924" cy="315" r="30" fill="none" stroke="#52463a" stroke-width="1.2"/>
      <circle cx="924" cy="315" r="30.4" fill="#a89464" fill-opacity="0.42" stroke="#a89464" stroke-width="2.4"/>
      <circle cx="924" cy="315" r="2.6" fill="#e0a463"/>
