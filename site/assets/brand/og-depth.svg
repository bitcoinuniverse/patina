<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="card-title">
  <title id="card-title">How depth works. Depth is the number of blocks a carrier output has stayed unspent.</title>
  <defs>
    <pattern id="strata" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#f0e8dc" fill-opacity="0.03"/>
    </pattern>
    <radialGradient id="age" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0a463" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#a89464" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#4ab7a4" stop-opacity="0.4"/>
    </radialGradient>
    <mask id="kerf">
      <rect x="600" y="0" width="600" height="630" fill="#ffffff"/>
      <path d="M940 315 L926 30 L954 30 Z" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#14110d"/>
  <rect width="1200" height="630" fill="url(#strata)"/>
  <path d="M600 0 L600 630" stroke="#52463a" stroke-width="1" stroke-opacity="0.5"/>

  <g mask="url(#kerf)">
    <circle cx="940" cy="315" r="177.0" fill="url(#age)"/>
    <g fill="none" stroke-width="2.2">
      <circle cx="940" cy="315" r="29.5" stroke="#9a9086" stroke-opacity="0.9"/>
      <circle cx="940" cy="315" r="59.0" stroke="#d8b57e" stroke-opacity="0.9"/>
      <circle cx="940" cy="315" r="88.5" stroke="#c9954f" stroke-opacity="0.9"/>
      <circle cx="940" cy="315" r="118.0" stroke="#b6a05a" stroke-opacity="0.9"/>
      <circle cx="940" cy="315" r="147.5" stroke="#a89464" stroke-opacity="0.9"/>
      <circle cx="940" cy="315" r="177.0" stroke="#8aa472" stroke-opacity="0.9"/>
      <circle cx="940" cy="315" r="206.5" stroke="#63b294" stroke-opacity="0.34" stroke-dasharray="4 8"/>
      <circle cx="940" cy="315" r="236.0" stroke="#4ab7a4" stroke-opacity="0.34" stroke-dasharray="4 8"/>
    </g>
    <circle cx="940" cy="315" r="177.0" fill="none" stroke="#8aa472" stroke-width="4"/>
    <circle cx="940" cy="315" r="13" fill="#e0a463"/>
  </g>

  <g transform="translate(80,150) scale(1.28)" fill="none" stroke="#f0e8dc" stroke-width="9" stroke-linecap="butt">
    <g transform="translate(10,0)">
      <path d="M0 80 L0 16 L22 16 A16 16 0 0 1 22 48 L0 48"/>
      <g transform="translate(58,0)">
        <path d="M0 80 L22 16 L44 80"/>
        <path d="M6.9 60 L37.1 60"/>
      </g>
      <g transform="translate(122,0)">
        <path d="M0 16 L44 16"/>
        <path d="M22 16 L22 80"/>
      </g>
      <path d="M192 16 L192 80"/>
      <path d="M218 80 L218 16 L258 80 L258 16"/>
      <g transform="translate(278,0)">
        <path d="M0 80 L22 16 L44 80"/>
        <path d="M6.9 60 L37.1 60"/>
      </g>
    </g>
  </g>

  <text x="80" y="120" fill="#6cc7ab" font-family="ui-monospace, Consolas, monospace" font-size="20" letter-spacing="6">HOW DEPTH WORKS</text>

  <text x="80" y="350" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="44">A subtraction between</text>
  <text x="80" y="404" fill="#f0e8dc" font-family="Georgia, 'Times New Roman', serif" font-size="44">two block heights.</text>
  <text x="80" y="472" fill="#a4977f" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">No accrual, no emission, no counterparty. Any Bitcoin node computes the same figure.</text>

  <path d="M80 520 L520 520" stroke="#52463a" stroke-width="1"/>
  <text x="80" y="558" fill="#a4977f" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="2">depth = current height minus carrier height</text>
</svg>
